spring.application.name=PulsePass

# Conexion a PostgreSQL (se puede sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway es el unico responsable del esquema; Hibernate solo lo valida
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
