$kind: http-request
name: E2E-AUTH-01A | Login USER_A | HTTP 200
description: |-
  ID: E2E-AUTH-01A
  Actor: ANONYMOUS
  Precondiciones: variables y fixtures preparados.
  HTTP esperado: 200.
  Revisión manual: Status, Body, campos del DTO, y persistencia si hay mutación.
  Copiar accessToken manualmente a userAToken
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{userAUsername}}",
      "password": "{{userAPassword}}"
    }
auth:
  type: noauth
order: 3000
