$kind: http-request
name: E2E-AUTH-01B | Login USER_B | HTTP 200
description: |-
  ID: E2E-AUTH-01B
  Actor: ANONYMOUS
  Precondiciones: variables y fixtures preparados.
  HTTP esperado: 200.
  Revisión manual: Status, Body, campos del DTO, y persistencia si hay mutación.
  Copiar accessToken a userBToken
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{userBUsername}}",
      "password": "{{userBPassword}}"
    }
auth:
  type: noauth
order: 4000
