$kind: http-request
name: E2E-AUTH-01C | Login STAFF | HTTP 200
description: |-
  ID: E2E-AUTH-01C
  Actor: ANONYMOUS
  Precondiciones: variables y fixtures preparados.
  HTTP esperado: 200.
  Revisión manual: Status, Body, campos del DTO, y persistencia si hay mutación.
  Copiar accessToken a staffToken
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{staffIdentifier}}",
      "password": "{{staffPassword}}"
    }
auth:
  type: noauth
order: 5000
