$kind: http-request
name: E2E-AUTH-01D | Login ADMIN | HTTP 200
description: |-
  ID: E2E-AUTH-01D
  Actor: ANONYMOUS
  Precondiciones: variables y fixtures preparados.
  HTTP esperado: 200.
  Revisión manual: Status, Body, campos del DTO, y persistencia si hay mutación.
  Copiar accessToken a adminToken
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identifier": "{{adminIdentifier}}",
      "password": "{{adminPassword}}"
    }
auth:
  type: noauth
order: 6000
