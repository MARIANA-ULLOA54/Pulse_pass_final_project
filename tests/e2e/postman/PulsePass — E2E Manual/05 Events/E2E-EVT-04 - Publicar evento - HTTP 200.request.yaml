$kind: http-request
name: E2E-EVT-04 | Publicar evento | HTTP 200
description: |-
  ID: E2E-EVT-04
  Actor: ADMIN
  Precondiciones: variables y fixtures preparados.
  HTTP esperado: 200.
  Revisión manual: Status, Body, campos del DTO, y persistencia si hay mutación.
  Tras publicar, copiar eventToPublishCode a publishedEventCode
url: "{{baseUrl}}/api/events/{{eventToPublishCode}}/publish"
method: PATCH
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 5000
